name: Update publications

on:
  schedule:
    # Every Monday at 07:35 IST = 02:05 UTC
    - cron: '5 2 * * 1'

  # Also allows us to test it manually from the GitHub Actions page
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Update publications from INSPIRE
        run: python3 scripts/update_publications.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render website
        run: quarto render

      - name: Commit publication updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add publications_body.qmd docs

          if git diff --cached --quiet; then
            echo "No publication changes."
          else
            git commit -m "Update publications from INSPIRE"
            git push
          fi
